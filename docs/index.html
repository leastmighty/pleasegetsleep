<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제잠자 — 제발 잠 좀 자</title>
<meta name="description" content="자고 싶은 시간을 알람처럼 정해두면, 그 전부터 점점 세지는 잔소리로 눕게 도와주는 앱.">
<style>
  :root {
    --bg: #11121a;
    --surface: #1b1d28;
    --accent: #e0b27c;
    --text: #e9e5dc;
    --muted: #8c8a9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 80px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    text-align: center;
  }
  main { max-width: 560px; margin: 0 auto; }
  .moon { font-size: 72px; line-height: 1; }
  h1 { font-size: 30px; margin: 22px 0 8px; }
  .tag { color: var(--muted); font-size: 15px; margin: 0 0 44px; }
  .points {
    display: grid;
    gap: 14px;
    text-align: left;
    margin-bottom: 44px;
  }
  .point {
    background: var(--surface);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .point b { display: block; font-size: 15px; margin-bottom: 4px; }
  .point span { color: var(--muted); font-size: 13.5px; }
  a { color: var(--accent); }
  footer {
    color: var(--muted);
    font-size: 13px;
    padding-top: 32px;
    border-top: 1px solid rgba(255,255,255,.07);
  }
</style>
</head>
<body>
<main>

  <div class="moon">🌙</div>
  <h1>제잠자</h1>
  <p class="tag">자야 하는 걸 아는데 안 눕는 사람을 위한 앱</p>

  <div class="points">
    <div class="point">
      <b>⏰ 취침 시각 전후로 여러 번</b>
      <span>60분 전, 10분 전… 시간을 넘겨도 계속 부릅니다.</span>
    </div>
    <div class="point">
      <b>💬 말투는 골라서</b>
      <span>다정 · 밝음 · 동기부여 · 매운맛 · 명언. 알림마다 다르게 둘 수 있고, 직접 써도 됩니다.</span>
    </div>
    <div class="point">
      <b>🔥 누우면 기록이 쌓여요</b>
      <span>늦게 자도 눕기만 하면 연속 기록은 이어집니다.</span>
    </div>
  </div>

  <footer>
    <p><a href="privacy.html">개인정보처리방침</a></p>
    <p><a href="https://github.com/leastmighty/pleasegetsleep">GitHub</a></p>
  </footer>

</main>
</body>
</html>
